<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>project 0 — cs 180</title>
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="../cs180.css">
</head>
<body>
    <header>
    </header>

    <main>
        <section class="section">
            <div class="section-content">
                <a class="back-link" href="../index.html">← cs 180</a>

                <h1 class="course-title">project 0</h1>
                <p class="course-subtitle">
                    becoming friends with your camera
                </p>

                <section class="part">
                    <h2 class="part-title">Part 1: Selfie: The Wrong Way vs. The Right Way</h2>
                    <div class="figure-grid cols-3">
                        <figure>
                            <img src="images/selfie1.jpg" width="900" height="1200"
                                 alt="Selfie taken from farther away and zoomed in">
                            <figcaption>far, zoomed in</figcaption>
                        </figure>
                        <figure>
                            <img src="images/selfie2.jpg" width="900" height="1200"
                                 alt="Selfie taken from a medium distance">
                            <figcaption>medium distance</figcaption>
                        </figure>
                        <figure>
                            <img src="images/selfie3.jpg" width="900" height="1200"
                                 alt="Selfie taken close to the camera with a wide field of view">
                            <figcaption>close, wide angle</figcaption>
                        </figure>
                    </div>
                </section>

                <section class="part">
                    <h2 class="part-title">Part 2: Architectural Perspective Compression</h2>
                    <div class="figure-grid cols-2">
                        <figure>
                            <img src="images/building1.jpg" width="1050" height="1400"
                                 alt="Wheeler Hall photographed from far away with a long focal length, so the facade appears flat and the columns stay nearly parallel">
                            <figcaption>far, zoomed in -> compressed perspective</figcaption>
                        </figure>
                        <figure>
                            <img src="images/building2.jpg" width="1050" height="1400"
                                 alt="Wheeler Hall photographed from close up with a wide angle, so the facade recedes sharply and the columns converge">
                            <figcaption>close, wide angle -> strong perspective</figcaption>
                        </figure>
                    </div>
                </section>

                <section class="part">
                    <h2 class="part-title">Part 3: The Dolly Zoom</h2>
                    <div class="figure-grid half">
                        <figure>
                            <img src="images/dolly-zoom.gif" width="1440" height="1920"
                                 alt="Dolly zoom effect on my colorpencils">
                            <figcaption>dolly zoom effect</figcaption>
                        </figure>
                    </div>
                </section>
            </div>
        </section>
    </main>

</body>
</html>
